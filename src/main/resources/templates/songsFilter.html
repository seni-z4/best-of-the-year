<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>

  <body class="container center">
    <div class="card text-center">
      <div class="card-header">
        <ul class="nav nav-pills card-header-pills">
          <li class="nav-item">
            <a class="nav-link disabled me-5" href="#">Best of</a>
          </li>
          <li class="nav-item me-3">
            <div
              th:insert="fragments/fragments :: buttonmovie(link='/movies' , titolo='Movies')"
            ></div>
          </li>
          <li class="nav-item">
            <a class="btn btn-primary active">Songs</a>
          </li>
        </ul>
      </div>
      <h2 class="pt-4" th:text="'Best Movies'"></h2>

      <div class="container">
        <table class="table table-bordered border-primary">
          <tr th:each="songs : ${songs}">
            <div th:if="${songs.id} == ${currentSong}">
              <p th:text="'the song title is : ' + ${songs.titolo}"></p>
            </div>
          </tr>
        </table>
      </div>
    </div>
  </body>
</html>
