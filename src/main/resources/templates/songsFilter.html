<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link

      crossorigin="anonymous"
    />

  <body>
    <!-- <p th:text="'all the movies names ' + ${songs}"></p> -->

    <div th:each="songs : ${songs}">
      <div th:if="${songs.id} == ${currentSong}">

        <p th:text="'the song title is ' + ${songs.titolo}"></p>
      </div>
    </div>
  </body>
</html>
