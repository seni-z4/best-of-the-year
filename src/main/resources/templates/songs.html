<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>

  <body class="container center">
    <div class="card text-center">
      <div class="card-header">
        <ul class="nav nav-pills card-header-pills">
          <li class="nav-item">
            <a class="nav-link disabled me-5" href="#">Best of</a>
          </li>
          <li class="nav-item me-3">
            <div
              th:insert="fragments/fragments :: buttonmovie(link='/movies' , titolo='Movies')"
            ></div>
          </li>
          <li class="nav-item">
            <div
              th:insert="fragments/fragments :: buttonsong(link='/songs' , titolo='Songs')"
            ></div>
          </li>
        </ul>
      </div>
      <h2 class="pt-4" th:text="'Best Songs'"></h2>

      <div class="container" style="width: 15rem">
        <table class="table table-bordered border-primary">
          <tr th:each="song : ${songs}">
            <td th:text="${song.titolo}"></td>
          </tr>
        </table>
      </div>

      <div
        th:insert="fragments/fragments :: buttonhome(link = '/' , titolo = 'HomePage')"
      ></div>
    </div>
  </body>
</html>
